<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مدرسہ ڈونیشن مینجمنٹ سسٹم</title>

  <!-- External Libraries -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Auth Container (Login, Signup, Forgot Password) -->
  <div id="auth-container" class="container">
    
    <!-- Login Screen -->
    <div id="login-box" class="card">
      <h2>مدرسہ لاگ ان</h2>
      <form id="login-form">
        <div class="form-group">
          <label>ای میل (Email):</label>
          <input type="email" id="login-email" placeholder="ای میل درج کریں" required>
        </div>
        <div class="form-group">
          <label>پاس ورڈ (Password):</label>
          <input type="password" id="login-password" placeholder="پاس ورڈ درج کریں" required>
        </div>
        <button type="submit" class="btn btn-primary">لاگ ان کریں</button>
      </form>
      <div class="auth-links">
        <a href="#" id="show-signup">نیا اکاؤنٹ بنائیں (Signup)</a> | 
        <a href="#" id="show-forgot">پاس ورڈ بھول گئے؟</a>
      </div>
    </div>

    <!-- Signup Screen -->
    <div id="signup-box" class="card hidden">
      <h2>نیا اکاؤنٹ بنائیں</h2>
      <form id="signup-form">
        <div class="form-group">
          <label>ای میل (Email):</label>
          <input type="email" id="signup-email" placeholder="ای میل درج کریں" required>
        </div>
        <div class="form-group">
          <label>پاس ورڈ (Password):</label>
          <input type="password" id="signup-password" placeholder="کم از کم 6 ہندسے" required>
        </div>
        <button type="submit" class="btn btn-success">رجسٹر کریں</button>
      </form>
      <div class="auth-links">
        <a href="#" id="show-login-from-signup">پہلے سے اکاؤنٹ ہے؟ لاگ ان کریں</a>
      </div>
    </div>

    <!-- Forgot Password Screen -->
    <div id="forgot-box" class="card hidden">
      <h2>پاس ورڈ ری سیٹ کریں</h2>
      <form id="forgot-form">
        <div class="form-group">
          <label>ای میل درج کریں:</label>
          <input type="email" id="forgot-email" placeholder="اپنی رجسٹرڈ ای میل درج کریں" required>
        </div>
        <button type="submit" class="btn btn-warning">ری سیٹ لنک بھیجیں</button>
      </form>
      <div class="auth-links">
        <a href="#" id="show-login-from-forgot">واپس لاگ ان کی طرف جائیں</a>
      </div>
    </div>

  </div>

  <!-- Main App Container (Hidden until Logged In) -->
  <div id="app-container" class="container hidden">
    
    <!-- Top Header -->
    <header class="app-header">
      <h1>🕌 مدرسہ ڈونیشن مینجمنٹ</h1>
      <button id="logout-btn" class="btn btn-danger btn-sm">لاگ آؤٹ</button>
    </header>

    <!-- Madrasa Selection Section -->
    <section class="card">
      <div class="form-group">
        <label>مدرسہ منتخب کریں:</label>
        <select id="madrasa-select">
          <option value="default">مرکزی مدرسہ</option>
        </select>
      </div>
      <button id="add-madrasa-btn" class="btn btn-secondary btn-sm">+ نیا مدرسہ شامل کریں</button>
    </section>

    <!-- New Receipt Form -->
    <section class="card">
      <h2>🧾 نئی رسید بنائیں</h2>
      <form id="receipt-form">
        <div class="form-grid">
          <div class="form-group">
            <label>جلد نمبر:</label>
            <input type="text" id="jild-no" required>
          </div>
          <div class="form-group">
            <label>صفحہ نمبر:</label>
            <input type="text" id="safha-no" required>
          </div>
          <div class="form-group">
            <label>رسید نمبر:</label>
            <input type="text" id="receipt-no" required>
          </div>
          <div class="form-group">
            <label>تاریخ:</label>
            <input type="date" id="receipt-date" required>
          </div>
          <div class="form-group">
            <label>نام ڈونر:</label>
            <input type="text" id="donor-name" required>
          </div>
          <div class="form-group">
            <label>موبائل نمبر:</label>
            <input type="tel" id="donor-mobile">
          </div>
          <div class="form-group">
            <label>پتہ:</label>
            <input type="text" id="donor-address">
          </div>
          <div class="form-group">
            <label>چندے کی مد:</label>
            <select id="donation-type">
              <option value="زکوٰۃ">زکوٰۃ</option>
              <option value="صدقات">صدقات</option>
              <option value="عام چندہ">عام چندہ</option>
              <option value="دیگر">دیگر</option>
            </select>
          </div>
          <div class="form-group">
            <label>رقم (₹):</label>
            <input type="number" id="donation-amount" required>
          </div>
        </div>

        <!-- OCR Scan Section -->
        <div class="form-group">
          <label>📷 رسید کی تصویر (OCR اسکینر):</label>
          <input type="file" id="receipt-image" accept="image/*">
          <button type="button" id="scan-ocr-btn" class="btn btn-info btn-sm">تصویر سے ڈیٹا پڑھیں</button>
        </div>

        <button type="submit" class="btn btn-success">💾 ریکارڈ محفوظ کریں</button>
      </form>
    </section>

    <!-- Search & Receipt List -->
    <section class="card">
      <h2>🔍 رسیدوں کی فہرست و تلاش</h2>
      <input type="text" id="search-input" placeholder="رسید نمبر یا نام سے تلاش کریں..." class="search-box">
      
      <div id="receipts-list" class="receipts-grid">
        <!-- Receipt cards will appear here -->
      </div>
    </section>

    <!-- Summary & Chart -->
    <section class="card">
      <h2>📊 مالی حساب و خلاصہ</h2>
      <div id="summary-boxes" class="summary-grid">
        <div class="summary-box">کل رسیدیں: <span id="total-receipts">0</span></div>
        <div class="summary-box">کل رقم: ₹<span id="total-amount">0</span></div>
      </div>
      <div class="chart-container">
        <canvas id="donationChart"></canvas>
      </div>
    </section>

    <!-- Backup & Restore -->
    <section class="card">
      <h2>💾 بیک اپ و بحالی</h2>
      <div class="action-buttons">
        <button id="backup-btn" class="btn btn-primary">📥 بیک اپ ڈاؤن لوڈ کریں</button>
        <input type="file" id="restore-file" accept=".json" class="hidden">
        <button id="restore-btn" class="btn btn-warning">📤 بیک اپ بحال کریں</button>
      </div>
    </section>

  </div>

  <script type="module" src="script-new.js"></script>
</body>
</html>
